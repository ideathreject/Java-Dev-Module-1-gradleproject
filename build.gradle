plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation 'com.google.code.gson:gson:2.10.1'
    
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes(
                'Main-Class': 'org.example.Main' // Заменить на твой путь к классу с main()
        )
    }
}

shadowJar {
    archiveBaseName.set('App')  // Название Fat JAR файла
    archiveClassifier.set('')      // Убираем "-all" из имени
    archiveVersion.set('')         // Убираем версию из имени
}